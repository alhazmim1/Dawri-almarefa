<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ترتيب الدوري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --pitch-dark:#0B241B;
    --pitch:#0F3D2E;
    --pitch-light:#17573F;
    --chalk:#F6F2E7;
    --gold:#F2B134;
    --gold-dim:#7A5B1E;
    --ink:#0B241B;
    --line:rgba(246,242,231,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, #1C6B4B 0%, transparent 45%),
      radial-gradient(circle at 110% 10%, #143d2c 0%, transparent 40%),
      var(--pitch-dark);
    color:var(--chalk);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,h3,.display{font-family:'Tajawal', sans-serif;}
  .wrap{max-width:700px;margin:0 auto;padding:0 18px;}

  header.top{
    padding:34px 18px 22px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header.top .logo-badge{
    width:88px;height:88px;border-radius:50%;
    background:#EAF1FB;margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.3), 0 0 0 3px rgba(242,177,52,0.55);
  }
  header.top .logo-badge img{width:100%;height:100%;object-fit:cover;}
  header.top .kicker{color:var(--gold);font-size:14px;font-weight:600;}
  header.top h1{font-size:32px;font-weight:900;margin:6px 0 4px;line-height:1.15;}
  header.top p{color:#B9CFC2;font-size:14px;margin:0;}

  nav.tabs{
    display:flex;justify-content:center;gap:8px;
    margin:22px auto 0;max-width:700px;padding:0 18px;
  }
  nav.tabs button{
    flex:1;padding:11px 8px;border-radius:10px;border:1px solid var(--line);
    background:transparent;color:#CFE0D7;font-family:'IBM Plex Sans Arabic',sans-serif;
    font-size:13.5px;font-weight:600;cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  nav.tabs button.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}

  main{padding-top:26px;}

  .empty{text-align:center;color:#9FB8AB;padding:60px 20px;font-size:15px;line-height:1.9;}
  .empty .big{font-size:32px;display:block;margin-bottom:10px;}

  .panel{
    background:var(--chalk);color:var(--ink);border-radius:16px;
    overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.28);margin-bottom:18px;
  }
  .panel .head{
    background:var(--pitch);color:var(--chalk);padding:14px 18px;
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:16px;
  }
  .panel .body{padding:14px 16px 18px;}

  table.standings{width:100%;border-collapse:collapse;font-size:13px;}
  table.standings th, table.standings td{
    padding:9px 6px;text-align:center;border-bottom:1px solid #E7E1CD;
  }
  table.standings th{font-size:11.5px;color:#5B6B62;font-weight:700;}
  table.standings td.team-name{text-align:right;font-weight:700;font-size:13.5px;}
  table.standings tr:last-child td{border-bottom:none;}
  table.standings tr.top3 td.team-name{color:var(--pitch);}
  table.standings tr.top3 .rank{color:var(--gold-dim);font-weight:900;}
  .rank{font-weight:700;}

  .scorer-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 4px;border-bottom:1px solid #E7E1CD;
  }
  .scorer-row:last-child{border-bottom:none;}
  .scorer-row .left{display:flex;align-items:center;gap:10px;}
  .scorer-row .pos{
    width:26px;height:26px;border-radius:50%;background:#EDE7D6;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:var(--pitch);
  }
  .scorer-row.leader .pos{background:var(--gold);color:var(--ink);}
  .scorer-row .pname{font-weight:700;font-size:14.5px;}
  .scorer-row .pteam{font-size:12px;color:#6B7A70;}
  .scorer-row .goals{font-weight:900;font-size:16px;color:var(--pitch);}
  .scorer-row.leader .goals{color:var(--gold-dim);}

  .card-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:26px;border-radius:3px;font-size:11.5px;font-weight:800;
    margin-inline-end:4px;
  }
  .card-yellow{background:#F2CB4E;color:#5B4A0A;}
  .card-red{background:#C23A3A;color:#fff;}
  .cards-cell{display:flex;gap:10px;justify-content:center;align-items:center;font-weight:700;font-size:13.5px;}

  .match-item{padding:12px 4px;border-bottom:1px solid #E7E1CD;font-size:13.5px;}
  .match-item:last-child{border-bottom:none;}
  .match-item .mline{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;margin-bottom:4px;}
  .match-item .score{background:var(--pitch);color:#fff;padding:2px 10px;border-radius:8px;font-family:'Tajawal',sans-serif;}
  .match-item .mscorers{font-size:12px;color:#6B7A70;text-align:center;}
  .match-item .mactions{display:flex;justify-content:center;margin-top:8px;}

  .note{font-size:12.5px;color:#6B7A70;margin-top:10px;text-align:center;}

  .admin-gate{
    max-width:340px;margin:60px auto;text-align:center;
    background:var(--chalk);color:var(--ink);border-radius:16px;padding:28px 22px;
  }
  .admin-gate h3{margin:0 0 6px;font-size:19px;}
  .admin-gate p{font-size:13.5px;color:#5B6B62;margin:0 0 18px;}
  input[type="password"], input[type="text"], input[type="number"], select{
    width:100%;padding:11px 13px;border-radius:10px;border:1px solid #D8D0BB;
    font-size:15px;font-family:'IBM Plex Sans Arabic',sans-serif;background:#fff;color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--pitch);outline-offset:1px;}
  .admin-gate .err{color:#B33A3A;font-size:13px;margin-top:10px;}

  .btn{
    display:inline-block;padding:11px 18px;border-radius:10px;border:none;
    font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;
  }
  .btn-primary{background:var(--pitch);color:#fff;}
  .btn-primary:hover{background:var(--pitch-light);}
  .btn-gold{background:var(--gold);color:var(--ink);}
  .btn-ghost{background:transparent;color:var(--pitch);border:1px solid #D8D0BB;}
  .btn-danger{background:transparent;color:#B33A3A;border:1px solid #E7C9C9;}
  .btn-block{width:100%;margin-top:12px;}
  .btn-sm{padding:7px 12px;font-size:13px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#3D4A42;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}

  .team-chip{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;border:1px solid #E3DCC9;border-radius:10px;margin-bottom:8px;background:#fff;
  }
  .team-chip .tname{font-weight:600;font-size:14px;}
  .team-chip button{background:none;border:none;color:#B33A3A;font-size:16px;cursor:pointer;}

  .scorer-input-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .scorer-input-row input[type="text"]{flex:2;}
  .scorer-input-row input[type="number"]{flex:1;}
  .scorer-input-row button{background:#EDE7D6;border:none;border-radius:8px;width:36px;color:#B33A3A;font-size:16px;cursor:pointer;flex:0 0 36px;}
  .add-scorer-btn{
    background:none;border:1px dashed #C8BFA6;color:var(--pitch);
    border-radius:10px;width:100%;padding:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;margin-top:2px;
  }
  .side-block{border:1px solid #E3DCC9;border-radius:12px;padding:12px;margin-bottom:10px;}
  .side-block h4{margin:0 0 8px;font-size:13.5px;color:var(--pitch);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--chalk);padding:11px 20px;border-radius:999px;
    font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,0.35);z-index:50;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .spinner{
    width:22px;height:22px;border-radius:50%;
    border:3px solid rgba(246,242,231,0.25);border-top-color:var(--gold);
    animation:spin .8s linear infinite;margin:40px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
const ADMIN_PIN = "3135";

const firebaseConfig = {
  apiKey: "AIzaSyCbx0wlVPWuIb4pHYkT0DPV7OculPahq2s",
  authDomain: "man-of-the-match-38be1.firebaseapp.com",
  databaseURL: "https://man-of-the-match-38be1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "man-of-the-match-38be1",
  storageBucket: "man-of-the-match-38be1.firebasestorage.app",
  messagingSenderId: "463420006699",
  appId: "1:463420006699:web:39e64fbba77c606bd1e56e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let teams = [];
let matches = [];
let adminUnlocked = sessionStorage.getItem('lg_admin') === '1';
let currentTab = 'standings';
let firstLoad = true;

const standingsView = document.getElementById('standingsView');
const scorersView = document.getElementById('scorersView');
const cardsView = document.getElementById('cardsView');
const adminView = document.getElementById('adminView');
const tabStandingsBtn = document.getElementById('tabStandingsBtn');
const tabScorersBtn = document.getElementById('tabScorersBtn');
const tabCardsBtn = document.getElementById('tabCardsBtn');
const tabAdminBtn = document.getElementById('tabAdminBtn');

tabStandingsBtn.onclick = () => switchTab('standings');
tabScorersBtn.onclick = () => switchTab('scorers');
tabCardsBtn.onclick = () => switchTab('cards');
tabAdminBtn.onclick = () => switchTab('admin');

function switchTab(tab){
  currentTab = tab;
  tabStandingsBtn.classList.toggle('active', tab==='standings');
  tabScorersBtn.classList.toggle('active', tab==='scorers');
  tabCardsBtn.classList.toggle('active', tab==='cards');
  tabAdminBtn.classList.toggle('active', tab==='admin');
  standingsView.style.display = tab==='standings' ? '' : 'none';
  scorersView.style.display = tab==='scorers' ? '' : 'none';
  cardsView.style.display = tab==='cards' ? '' : 'none';
  adminView.style.display = tab==='admin' ? '' : 'none';
  if(tab==='standings') renderStandings();
  if(tab==='scorers') renderScorers();
  if(tab==='cards') renderCards();
  if(tab==='admin') renderAdmin();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---------- Realtime data ----------
db.ref('league/teams').on('value', snap=>{
  const val = snap.val();
  teams = val ? Object.values(val) : [];
  firstLoad = false;
  rerenderCurrent();
}, ()=> showToast('تعذّر الاتصال بقاعدة البيانات'));

db.ref('league/matches').on('value', snap=>{
  const val = snap.val();
  matches = val ? Object.values(val) : [];
  rerenderCurrent();
});

function rerenderCurrent(){
  if(currentTab==='standings') renderStandings();
  if(currentTab==='scorers') renderScorers();
  if(currentTab==='cards') renderCards();
  if(currentTab==='admin' && adminUnlocked) renderAdminPanel();
}

// ---------- Standings computation ----------
function computeStandings(){
  const table = {};
  for(const t of teams){
    table[t.id] = {id:t.id, name:t.name, played:0, win:0, draw:0, loss:0, gf:0, ga:0, pts:0};
  }
  for(const m of matches){
    const a = table[m.teamAId];
    const b = table[m.teamBId];
    if(!a || !b) continue;
    a.played++; b.played++;
    a.gf += m.scoreA; a.ga += m.scoreB;
    b.gf += m.scoreB; b.ga += m.scoreA;
    if(m.scoreA > m.scoreB){ a.win++; a.pts+=3; b.loss++; }
    else if(m.scoreA < m.scoreB){ b.win++; b.pts+=3; a.loss++; }
    else { a.draw++; b.draw++; a.pts+=1; b.pts+=1; }
  }
  const rows = Object.values(table).map(r=>({...r, gd: r.gf-r.ga}));
  rows.sort((x,y)=> y.pts-x.pts || y.gd-x.gd || y.gf-x.gf || x.name.localeCompare(y.name,'ar'));
  return rows;
}

function renderStandings(){
  if(firstLoad){ standingsView.innerHTML = '<div class="spinner"></div>'; return; }

  if(teams.length===0){
    standingsView.innerHTML = '<div class="empty"><span class="big">🏆</span>ما فيه فرق مضافة بعد.<br>راح يظهر الترتيب هنا أول ما ينزّل المنظم فرق الدوري.</div>';
    return;
  }

  const rows = computeStandings();
  let html = `<div class="panel">
    <div class="head">جدول الترتيب</div>
    <div class="body">
      <table class="standings">
        <thead><tr>
          <th>#</th><th style="text-align:right">الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>له</th><th>عليه</th><th>فارق</th><th>نقاط</th>
        </tr></thead>
        <tbody>`;
  rows.forEach((r, i)=>{
    html += `<tr class="${i<3?'top3':''}">
      <td class="rank">${i+1}</td>
      <td class="team-name">${escapeHtml(r.name)}</td>
      <td>${r.played}</td><td>${r.win}</td><td>${r.draw}</td><td>${r.loss}</td>
      <td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?'+':''}${r.gd}</td>
      <td><strong>${r.pts}</strong></td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;

  html += `<div class="panel"><div class="head">آخر النتائج</div><div class="body">`;
  const sortedMatches = [...matches].sort((a,b)=> b.createdAt - a.createdAt);
  if(sortedMatches.length===0){
    html += `<div class="note">ما فيه نتائج مسجلة بعد</div>`;
  } else {
    for(const m of sortedMatches){
      html += `<div class="match-item">
        <div class="mline">
          <span>${escapeHtml(m.teamAName)}</span>
          <span class="score">${m.scoreA} - ${m.scoreB}</span>
          <span>${escapeHtml(m.teamBName)}</span>
        </div>
      </div>`;
    }
  }
  html += `</div></div>`;

  standingsView.innerHTML = html;
}

// ---------- Top scorers ----------
function computeScorers(){
  const map = {};
  for(const m of matches){
    for(const s of (m.scorersA||[])){
      const key = s.name+'|'+m.teamAName;
      if(!map[key]) map[key] = {name:s.name, team:m.teamAName, goals:0};
      map[key].goals += Number(s.goals)||0;
    }
    for(const s of (m.scorersB||[])){
      const key = s.name+'|'+m.teamBName;
      if(!map[key]) map[key] = {name:s.name, team:m.teamBName, goals:0};
      map[key].goals += Number(s.goals)||0;
    }
  }
  const list = Object.values(map).filter(p=>p.goals>0);
  list.sort((a,b)=> b.goals-a.goals || a.name.localeCompare(b.name,'ar'));
  return list;
}

function renderScorers(){
  if(firstLoad){ scorersView.innerHTML = '<div class="spinner"></div>'; return; }

  const list = computeScorers();
  if(list.length===0){
    scorersView.innerHTML = '<div class="empty"><span class="big">⚽</span>ما فيه أهداف مسجلة بعد.<br>راح تظهر هنا أول ما تنزّل نتيجة فيها أسماء هدافين.</div>';
    return;
  }

  const maxGoals = list[0].goals;
  let html = `<div class="panel"><div class="head">ترتيب الهدافين</div><div class="body">`;
  list.forEach((p, i)=>{
    const isLeader = p.goals===maxGoals;
    html += `<div class="scorer-row ${isLeader?'leader':''}">
      <div class="left">
        <div class="pos">${i+1}</div>
        <div>
          <div class="pname">${escapeHtml(p.name)}</div>
          <div class="pteam">${escapeHtml(p.team)}</div>
        </div>
      </div>
      <div class="goals">${p.goals}</div>
    </div>`;
  });
  html += `</div></div>`;
  scorersView.innerHTML = html;
}

// ---------- Cards (yellow / red) ----------
function computeCards(){
  const map = {};
  for(const m of matches){
    for(const c of (m.cardsA||[])){
      const key = c.name+'|'+m.teamAName;
      if(!map[key]) map[key] = {name:c.name, team:m.teamAName, yellow:0, red:0};
      map[key].yellow += Number(c.yellow)||0;
      map[key].red += Number(c.red)||0;
    }
    for(const c of (m.cardsB||[])){
      const key = c.name+'|'+m.teamBName;
      if(!map[key]) map[key] = {name:c.name, team:m.teamBName, yellow:0, red:0};
      map[key].yellow += Number(c.yellow)||0;
      map[key].red += Number(c.red)||0;
    }
  }
  const list = Object.values(map).filter(p=> p.yellow>0 || p.red>0);
  list.sort((a,b)=> b.red-a.red || b.yellow-a.yellow || a.name.localeCompare(b.name,'ar'));
  return list;
}

function renderCards(){
  if(firstLoad){ cardsView.innerHTML = '<div class="spinner"></div>'; return; }

  const list = computeCards();
  if(list.length===0){
    cardsView.innerHTML = '<div class="empty"><span class="big">🟨</span>ما فيه بطاقات مسجلة بعد.</div>';
    return;
  }

  let html = `<div class="panel"><div class="head">سجل البطاقات</div><div class="body">
    <table class="standings">
      <thead><tr><th style="text-align:right">اللاعب</th><th>الفريق</th><th>صفراء</th><th>حمراء</th></tr></thead>
      <tbody>`;
  list.forEach(p=>{
    html += `<tr>
      <td class="team-name">${escapeHtml(p.name)}</td>
      <td style="font-size:12px;color:#6B7A70;">${escapeHtml(p.team)}</td>
      <td>${p.yellow>0 ? `<span class="card-badge card-yellow">${p.yellow}</span>` : '—'}</td>
      <td>${p.red>0 ? `<span class="card-badge card-red">${p.red}</span>` : '—'}</td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;
  cardsView.innerHTML = html;
}

// ---------- Admin ----------
function renderAdmin(){
  if(!adminUnlocked){
    adminView.innerHTML = `
      <div class="admin-gate">
        <h3>دخول المنظم</h3>
        <p>أدخل الرمز السري عشان تدير الفرق والنتائج</p>
        <input type="password" id="pinInput" placeholder="الرمز السري" inputmode="numeric">
        <button class="btn btn-primary btn-block" id="pinSubmit">دخول</button>
        <div class="err" id="pinErr" style="display:none;">الرمز غير صحيح</div>
      </div>`;
    document.getElementById('pinSubmit').onclick = checkPin;
    document.getElementById('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') checkPin(); });
    return;
  }
  renderAdminPanel();
}

function checkPin(){
  const val = document.getElementById('pinInput').value;
  if(val === ADMIN_PIN){
    adminUnlocked = true;
    try{ sessionStorage.setItem('lg_admin','1'); }catch(e){}
    renderAdminPanel();
  } else {
    document.getElementById('pinErr').style.display = 'block';
  }
}

let scorerDraftA = [];
let scorerDraftB = [];
let cardDraftA = [];
let cardDraftB = [];

function renderAdminPanel(){
  adminView.innerHTML = `
    <div class="panel">
      <div class="head">فرق الدوري</div>
      <div class="body">
        <div id="teamsList"></div>
        <div class="row2" style="margin-top:10px;">
          <div><input type="text" id="newTeamName" placeholder="اسم فريق جديد"></div>
        </div>
        <button class="btn btn-ghost btn-block" id="addTeamBtn">+ إضافة فريق</button>
      </div>
    </div>

    <div class="panel">
      <div class="head">تسجيل نتيجة مباراة</div>
      <div class="body">
        <div class="side-block">
          <h4>الفريق الأول</h4>
          <div class="field">
            <select id="teamASelect"></select>
          </div>
          <div class="field">
            <label>عدد أهدافه</label>
            <input type="number" id="scoreA" min="0" value="0">
          </div>
          <label style="font-size:12.5px;font-weight:600;color:#3D4A42;">هدافو هذا الفريق (اختياري)</label>
          <div id="scorersAInputs" style="margin-top:6px;"></div>
          <button class="add-scorer-btn" id="addScorerABtn">+ إضافة هداف</button>

          <label style="font-size:12.5px;font-weight:600;color:#3D4A42;display:block;margin-top:12px;">بطاقات هذا الفريق (اختياري)</label>
          <div id="cardsAInputs" style="margin-top:6px;"></div>
          <button class="add-scorer-btn" id="addCardABtn">+ إضافة بطاقة</button>
        </div>

        <div class="side-block">
          <h4>الفريق الثاني</h4>
          <div class="field">
            <select id="teamBSelect"></select>
          </div>
          <div class="field">
            <label>عدد أهدافه</label>
            <input type="number" id="scoreB" min="0" value="0">
          </div>
          <label style="font-size:12.5px;font-weight:600;color:#3D4A42;">هدافو هذا الفريق (اختياري)</label>
          <div id="scorersBInputs" style="margin-top:6px;"></div>
          <button class="add-scorer-btn" id="addScorerBBtn">+ إضافة هداف</button>

          <label style="font-size:12.5px;font-weight:600;color:#3D4A42;display:block;margin-top:12px;">بطاقات هذا الفريق (اختياري)</label>
          <div id="cardsBInputs" style="margin-top:6px;"></div>
          <button class="add-scorer-btn" id="addCardBBtn">+ إضافة بطاقة</button>
        </div>

        <button class="btn btn-gold btn-block" id="saveMatchBtn">حفظ النتيجة</button>
      </div>
    </div>

    <div class="panel">
      <div class="head">المباريات المسجلة</div>
      <div class="body" id="matchesManageList"></div>
    </div>
  `;

  renderTeamsList();
  renderTeamSelects();
  renderScorerInputs('A');
  renderScorerInputs('B');
  renderCardInputs('A');
  renderCardInputs('B');
  renderMatchesManageList();

  document.getElementById('addTeamBtn').onclick = addTeam;
  document.getElementById('addScorerABtn').onclick = ()=>{ scorerDraftA.push({name:'',goals:1}); renderScorerInputs('A'); };
  document.getElementById('addScorerBBtn').onclick = ()=>{ scorerDraftB.push({name:'',goals:1}); renderScorerInputs('B'); };
  document.getElementById('addCardABtn').onclick = ()=>{ cardDraftA.push({name:'',yellow:1,red:0}); renderCardInputs('A'); };
  document.getElementById('addCardBBtn').onclick = ()=>{ cardDraftB.push({name:'',yellow:1,red:0}); renderCardInputs('B'); };
  document.getElementById('saveMatchBtn').onclick = saveMatch;
}

function renderTeamsList(){
  const wrap = document.getElementById('teamsList');
  if(teams.length===0){
    wrap.innerHTML = '<div class="note">أضف فرق الدوري أول شي</div>';
    return;
  }
  wrap.innerHTML = '';
  teams.forEach(t=>{
    const chip = document.createElement('div');
    chip.className = 'team-chip';
    chip.innerHTML = `<span class="tname">${escapeHtml(t.name)}</span><button data-id="${t.id}">×</button>`;
    wrap.appendChild(chip);
  });
  wrap.querySelectorAll('button').forEach(b=> b.onclick = ()=> deleteTeam(b.dataset.id));
}

function addTeam(){
  const input = document.getElementById('newTeamName');
  const name = input.value.trim();
  if(!name){ showToast('اكتب اسم الفريق'); return; }
  const id = db.ref('league/teams').push().key;
  db.ref('league/teams/'+id).set({id, name})
    .then(()=>{ input.value=''; showToast('تمت إضافة الفريق'); })
    .catch(()=> showToast('صار خطأ، حاول ثانية'));
}

function deleteTeam(id){
  db.ref('league/teams/'+id).remove().catch(()=> showToast('صار خطأ، حاول ثانية'));
}

function renderTeamSelects(){
  const selA = document.getElementById('teamASelect');
  const selB = document.getElementById('teamBSelect');
  const opts = teams.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
  selA.innerHTML = opts || '<option value="">أضف فرق أول</option>';
  selB.innerHTML = opts || '<option value="">أضف فرق أول</option>';
  if(teams.length>1) selB.selectedIndex = 1;
}

function renderScorerInputs(side){
  const draft = side==='A' ? scorerDraftA : scorerDraftB;
  const wrap = document.getElementById('scorers'+side+'Inputs');
  wrap.innerHTML = '';
  draft.forEach((s, idx)=>{
    const row = document.createElement('div');
    row.className = 'scorer-input-row';
    row.innerHTML = `
      <input type="text" placeholder="اسم اللاعب" value="${escapeHtml(s.name)}" data-idx="${idx}" data-field="name">
      <input type="number" min="1" value="${s.goals}" data-idx="${idx}" data-field="goals">
      <button data-idx="${idx}">×</button>
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const idx = e.target.dataset.idx, field = e.target.dataset.field;
      draft[idx][field] = field==='goals' ? Number(e.target.value) : e.target.value;
    });
  });
  wrap.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', e=>{
      draft.splice(e.target.dataset.idx,1);
      renderScorerInputs(side);
    });
  });
}

function renderCardInputs(side){
  const draft = side==='A' ? cardDraftA : cardDraftB;
  const wrap = document.getElementById('cards'+side+'Inputs');
  wrap.innerHTML = '';
  draft.forEach((c, idx)=>{
    const row = document.createElement('div');
    row.className = 'scorer-input-row';
    row.innerHTML = `
      <input type="text" placeholder="اسم اللاعب" value="${escapeHtml(c.name)}" data-idx="${idx}" data-field="name">
      <select data-idx="${idx}" data-field="type" style="flex:1;padding:8px;">
        <option value="yellow" ${c.red===0?'selected':''}>صفراء</option>
        <option value="red" ${c.red>0?'selected':''}>حمراء</option>
      </select>
      <button data-idx="${idx}">×</button>
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const idx = e.target.dataset.idx;
      draft[idx].name = e.target.value;
    });
  });
  wrap.querySelectorAll('select').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const idx = e.target.dataset.idx;
      if(e.target.value==='red'){ draft[idx].yellow = 0; draft[idx].red = 1; }
      else { draft[idx].yellow = 1; draft[idx].red = 0; }
    });
  });
  wrap.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', e=>{
      draft.splice(e.target.dataset.idx,1);
      renderCardInputs(side);
    });
  });
}

function saveMatch(){
  const teamAId = document.getElementById('teamASelect').value;
  const teamBId = document.getElementById('teamBSelect').value;
  const scoreA = Number(document.getElementById('scoreA').value);
  const scoreB = Number(document.getElementById('scoreB').value);

  if(!teamAId || !teamBId){ showToast('أضف فرق الدوري أول'); return; }
  if(teamAId === teamBId){ showToast('اختر فريقين مختلفين'); return; }
  if(isNaN(scoreA) || isNaN(scoreB) || scoreA<0 || scoreB<0){ showToast('تأكد من عدد الأهداف'); return; }

  const teamA = teams.find(t=>t.id===teamAId);
  const teamB = teams.find(t=>t.id===teamBId);

  const cleanScorers = draft => draft.filter(s=>s.name.trim()!=='' && s.goals>0).map(s=>({name:s.name.trim(), goals:s.goals}));
  const cleanCards = draft => draft.filter(c=>c.name.trim()!=='').map(c=>({name:c.name.trim(), yellow:c.yellow||0, red:c.red||0}));

  const btn = document.getElementById('saveMatchBtn');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';

  const id = db.ref('league/matches').push().key;
  const matchData = {
    id,
    teamAId, teamBId,
    teamAName: teamA.name, teamBName: teamB.name,
    scoreA, scoreB,
    scorersA: cleanScorers(scorerDraftA),
    scorersB: cleanScorers(scorerDraftB),
    cardsA: cleanCards(cardDraftA),
    cardsB: cleanCards(cardDraftB),
    createdAt: Date.now()
  };

  db.ref('league/matches/'+id).set(matchData)
    .then(()=>{
      showToast('تم حفظ النتيجة');
      scorerDraftA = []; scorerDraftB = [];
      cardDraftA = []; cardDraftB = [];
      document.getElementById('scoreA').value = 0;
      document.getElementById('scoreB').value = 0;
      renderAdminPanel();
    })
    .catch(()=>{
      showToast('صار خطأ بالحفظ، جرّب مرة ثانية');
      btn.disabled = false; btn.textContent = 'حفظ النتيجة';
    });
}

function renderMatchesManageList(){
  const wrap = document.getElementById('matchesManageList');
  const sorted = [...matches].sort((a,b)=> b.createdAt - a.createdAt);
  if(sorted.length===0){
    wrap.innerHTML = '<div class="note">ما فيه نتائج مسجلة بعد</div>';
    return;
  }
  wrap.innerHTML = '';
  for(const m of sorted){
    const item = document.createElement('div');
    item.className = 'match-item';
    const scorersLine = [...(m.scorersA||[]), ...(m.scorersB||[])].map(s=>`${s.name} (${s.goals})`).join('، ');
    const cardsLine = [...(m.cardsA||[]), ...(m.cardsB||[])].map(c=>`${c.name} ${c.red>0?'🟥':'🟨'}`).join('، ');
    item.innerHTML = `
      <div class="mline">
        <span>${escapeHtml(m.teamAName)}</span>
        <span class="score">${m.scoreA} - ${m.scoreB}</span>
        <span>${escapeHtml(m.teamBName)}</span>
      </div>
      ${scorersLine ? `<div class="mscorers">⚽ ${escapeHtml(scorersLine)}</div>` : ''}
      ${cardsLine ? `<div class="mscorers">${cardsLine}</div>` : ''}
      <div class="mactions"><button class="btn btn-danger btn-sm" data-id="${m.id}">حذف النتيجة</button></div>
    `;
    wrap.appendChild(item);
  }
  wrap.querySelectorAll('button[data-id]').forEach(b=>{
    b.onclick = ()=> db.ref('league/matches/'+b.dataset.id).remove().catch(()=> showToast('صار خطأ، حاول ثانية'));
  });
}

renderStandings();
</script>
